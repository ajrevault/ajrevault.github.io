name: Update BLS data
on:
  schedule:
    - cron: "0 6 1 * *"     # 1st of each month
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch series
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
        run: |
          mkdir -p data/portfolio
          for pair in "wk5_bls_social:TUU10101AA01013951" "wk5_bls_house:TUU10101AA01001102"; do
            name="${pair%%:*}"; id="${pair##*:}"
            curl -s "https://api.bls.gov/publicAPI/v2/timeseries/data/${id}?startyear=2006&endyear=2025&registrationkey=${BLS_KEY}" -o "tmp_${name}.json"
            if jq -e '.status=="REQUEST_SUCCEEDED"' "tmp_${name}.json" > /dev/null; then
              mv "tmp_${name}.json" "data/portfolio/${name}.json"
            else
              echo "Request failed for ${id}"; cat "tmp_${name}.json"
            fi
          done
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update BLS data" && git push)
